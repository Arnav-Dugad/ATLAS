repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/engine/
      - id: ruff-format
        files: ^services/engine/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^apps/web/src/lib/openapi.json$
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.(webp|png|svg)$
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: web-typecheck
        name: web typecheck
        entry: pnpm --filter @atlas/web typecheck
        language: system
        pass_filenames: false
        files: ^apps/web/
