# Free public demo: a read-only snapshot of ATLAS rebuilt on a schedule and served by GitHub Pages.
# The engine runs here only long enough to sync the open sources and export JSON; no server,
# no keys, no paid services. Engine state (DuckDB + HTTP cache) rolls forward between runs via
# the Actions cache so incident histories and change logs accumulate.
name: Public demo

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, off the hour to spread load on upstream feeds
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/engine/**"
      - "data/registry/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Sync, export and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/pyproject.toml
      - name: Install engine
        run: pip install -e "services/engine[raster]"

      - name: Restore population pack
        uses: actions/cache@v4
        with:
          path: data/runtime/packs/population-ghsl
          key: pack-population-ghsl-2025-r2023a-v1
      - name: Restore engine state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/runtime/atlas.duckdb
            data/runtime/atlas.duckdb.wal
            data/runtime/cache
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-

      - name: Set up engine and core pack
        run: atlas setup
      - name: Install population pack (first run only, cached afterwards)
        run: atlas packs install population-ghsl || echo "::warning::Population pack unavailable; exposure will be omitted from this snapshot"
      - name: Sync open sources
        timeout-minutes: 15
        continue-on-error: true
        run: atlas sync all
      - name: Export static snapshot
        env:
          ATLAS_OPENAQ_API_KEY: ${{ secrets.ATLAS_OPENAQ_API_KEY }} # optional; air quality for top incidents
        run: atlas export-static apps/web/public/snapshot

      - name: Save engine state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/runtime/atlas.duckdb
            data/runtime/atlas.duckdb.wal
            data/runtime/cache
          key: engine-state-${{ github.run_id }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app in snapshot mode
        env:
          ATLAS_BASE: ./ # relative: the same build serves from /ATLAS/ on Pages and from a root domain
          ATLAS_SOURCEMAP: "0"
          VITE_ATLAS_STATIC: "1"
        run: pnpm --filter @atlas/web build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - name: Keep the build for the site branch
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/dist
          retention-days: 2

  # Publishes the same build to the `site` branch as a single commit. Any static host that can
  # follow a git branch (Vercel, Cloudflare Pages, Netlify) serves it with no build step.
  # Isolated from the build job so the only code holding a write token is this short script.
  publish-branch:
    name: Publish site branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: site
      - name: Push orphan commit to the site branch
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Public snapshot $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
