# Desktop installers (Tauri): the web interface in a native window, with the Python engine
# bundled alongside (PyInstaller). Built on GitHub's free runners for Windows, macOS and Linux;
# run by hand (optionally Windows only) or by pushing a v* tag, which drafts a release with the
# installers and the signed update manifest (latest.json) the Windows app checks.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        options: [all, windows]
        default: all
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Skip platforms that were not asked for
        id: want
        shell: bash
        run: |
          if [ "${{ inputs.platforms }}" = "windows" ] && [ "$RUNNER_OS" != "Windows" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.want.outputs.run == 'true'

      - name: Linux build dependencies
        if: steps.want.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v6
        if: steps.want.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/pyproject.toml
      - name: Install the engine and PyInstaller
        if: steps.want.outputs.run == 'true'
        run: pip install -e "services/engine[raster]" pyinstaller

      - uses: dtolnay/rust-toolchain@stable
        if: steps.want.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.want.outputs.run == 'true'
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - uses: pnpm/action-setup@v4
        if: steps.want.outputs.run == 'true'
      - uses: actions/setup-node@v5
        if: steps.want.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install web and desktop dependencies
        if: steps.want.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Windows: a folder (ready in ~2 s; a one-file build unpacks ~300 MB on every start, ~5 s).
      # macOS/Linux: the one-file sidecar.
      - name: Build the engine
        if: steps.want.outputs.run == 'true'
        shell: bash
        run: |
          cd services/engine
          COMMON=(--noconfirm --name atlas-engine
            --collect-data atlas --collect-submodules atlas --collect-submodules uvicorn
            --collect-all rasterio --collect-data pyproj --hidden-import sse_starlette
            --add-data "../../data/registry/sources.json:data/registry"
            --add-data "../../docs:docs")
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller "${COMMON[@]}" --onedir desktop_entry.py
            rm -rf ../../apps/desktop/src-tauri/engine
            cp -r dist/atlas-engine ../../apps/desktop/src-tauri/engine
            du -sh ../../apps/desktop/src-tauri/engine
          else
            TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
            pyinstaller "${COMMON[@]}" --onefile desktop_entry.py
            mkdir -p ../../apps/desktop/src-tauri/binaries
            cp "dist/atlas-engine" "../../apps/desktop/src-tauri/binaries/atlas-engine-$TRIPLE"
            ls -la ../../apps/desktop/src-tauri/binaries
          fi

      - name: Build the web interface for the desktop app
        if: steps.want.outputs.run == 'true'
        working-directory: apps/web
        env:
          ATLAS_BASE: ./
          ATLAS_SOURCEMAP: "0"
          VITE_ATLAS_API: http://127.0.0.1:8787
          VITE_ATLAS_DESKTOP: "1"
        run: |
          npx tsc -b
          npx vite build --outDir dist-desktop

      - name: Build installers
        if: steps.want.outputs.run == 'true'
        working-directory: apps/desktop
        env:
          # signs the Windows update artifacts (.sig) so the app only installs genuine updates
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run == 'true'
        with:
          name: atlas-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - name: Update manifest for the Windows app (latest.json)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP=$(find installers -type f -name '*-setup.exe' | head -1)
          SIG="$SETUP.sig"
          if [ -n "$SETUP" ] && [ -f "$SIG" ]; then
            NAME=$(basename "$SETUP")
            jq -n --arg v "$VERSION" --arg sig "$(cat "$SIG")" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${NAME}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, notes: "See the release notes on GitHub.", pub_date: $date,
                platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > installers/latest.json
            cat installers/latest.json | jq '.platforms."windows-x86_64".url'
          else
            echo "::warning::No signed Windows installer found; latest.json not written."
          fi
      - name: Create (or update) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # artifacts keep their bundle sub-folders (msi/, nsis/, dmg/, appimage/, deb/)
          mapfile -t files < <(find installers -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.sig' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name 'latest.json' \) | sort)
          printf '%s\n' "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "ATLAS $GITHUB_REF_NAME" \
              --notes "Desktop installers built by GitHub Actions. Unsigned: Windows SmartScreen and macOS Gatekeeper will ask for confirmation on first launch. ATLAS is a research tool, not an official warning service." \
              "${files[@]}"
          fi
