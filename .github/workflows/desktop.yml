# Desktop installers (Tauri): the web interface in a native window, with the Python engine
# bundled as a self-contained sidecar (PyInstaller). Built on GitHub's free runners for
# Windows, macOS and Linux; run by hand or by pushing a v* tag (which drafts a release).
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/pyproject.toml
      - name: Install the engine and PyInstaller
        run: pip install -e "services/engine[raster]" pyinstaller

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install web and desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine sidecar
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cd services/engine
          pyinstaller --noconfirm --onefile --name atlas-engine \
            --collect-data atlas --collect-submodules atlas --collect-submodules uvicorn \
            --collect-all rasterio --collect-data pyproj --hidden-import sse_starlette \
            --add-data "../../data/registry/sources.json:data/registry" \
            --add-data "../../docs:docs" \
            desktop_entry.py
          mkdir -p ../../apps/desktop/src-tauri/binaries
          cp "dist/atlas-engine$EXT" "../../apps/desktop/src-tauri/binaries/atlas-engine-$TRIPLE$EXT"
          ls -la ../../apps/desktop/src-tauri/binaries

      - name: Build the web interface for the desktop app
        working-directory: apps/web
        env:
          ATLAS_BASE: ./
          ATLAS_SOURCEMAP: "0"
          VITE_ATLAS_API: http://127.0.0.1:8787
          VITE_ATLAS_DESKTOP: "1"
        run: |
          npx tsc -b
          npx vite build --outDir dist-desktop

      - name: Build installers
        working-directory: apps/desktop
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # artifacts keep their bundle sub-folders (msi/, nsis/, dmg/, appimage/, deb/)
          mapfile -t files < <(find installers -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          printf '%s\n' "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "ATLAS $GITHUB_REF_NAME" \
              --notes "Desktop installers built by GitHub Actions. Unsigned: Windows SmartScreen and macOS Gatekeeper will ask for confirmation on first launch. ATLAS is a research tool, not an official warning service." \
              "${files[@]}"
          fi
