name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,raster]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        env:
          PYTHONUTF8: "1"
        run: pytest -q

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @atlas/web typecheck
      - name: Lint
        run: pnpm --filter @atlas/web lint
      - name: Test
        run: pnpm --filter @atlas/web test
      - name: Build
        run: pnpm --filter @atlas/web build

  e2e:
    name: End-to-end (Playwright, desktop + phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Build against the real-data fixture and test
        run: pnpm --filter @atlas/web e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
